<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户注册</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>用户注册</h1>
    </header>
    <main>
        <form id="registerForm">
            <p>
                <label for="username">用户名：</label>
                <input type="text" name="username" id="username" required placeholder="请输入用户名">
            </p>
            <p>
                <label for="password">密码：</label>
                <input type="password" name="password" id="password" placeholder="6‑16位字符">
            </p>
            <p>
                <label for="confirmPassword">确认密码：</label>
                <input type="password" name="confirmPassword" id="confirmPassword">
            </p>
            <p>
                性别：
                <input type="radio" name="gender" id="male" value="male" checked>
                <label for="male">男</label>
                <label>
                    <input type="radio" name="gender" value="female">女
                </label>
            </p>
            <p>
                <label for="birthday">出生日期：</label>
                <input type="date" name="birthday" id="birthday">
            </p>
            <p>
                <label for="email">邮箱：</label>
                <input type="email" name="email" id="email" required>
            </p>
            <p>
                <label for="phone">手机号：</label>
                <input type="tel" name="phone" id="phone" pattern="[0-9]{11}" placeholder="请输入11位手机号">
            </p>
            <p>
                兴趣爱好：
                <label><input type="checkbox" name="hobby" value="reading">阅读</label>
                <label><input type="checkbox" name="hobby" value="sports">运动</label>
                <label><input type="checkbox" name="hobby" value="music">音乐</label>
            </p>
            <p>
                <label for="avatar">上传头像：</label>
                <input type="file" name="avatar" id="avatar" accept="image/*">
            </p>
            <p>
                <label for="city">所在城市：</label>
                <select name="city" id="city">
                    <option value="changde" selected>常德</option>
                    <option value="changsha">长沙</option>
                    <option value="zhuzhou">株洲</option>
                </select>
            </p>
            <p>
                <label for="bio">个人简介：</label><br>
                <textarea name="bio" id="bio" rows="4" cols="50"></textarea>
            </p>
            <p>
                <button type="submit">注册</button>
                <button type="reset">重置</button>
            </p>
        </form>
    </main>
    <footer>
        <p>©2026 用户注册系统 版权所有</p>
    </footer>

    <script>
        const form = document.getElementById('registerForm');
        form.addEventListener('submit', function(e){
            e.preventDefault();
            //注册完成跳转到登录页面
            location.href = "login.html";
        })
    </script>
</body>
</html>
