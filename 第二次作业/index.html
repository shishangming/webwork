<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>首页</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>用户注册</h1>
    </header>
    <main>
        <h2>注册须知</h2>
        <table border="1" cellpadding="6" cellspacing="0">
            <thead>
                <tr>
                    <th colspan="3">账号注册相关规则</th>
                </tr>
                <tr>
                    <th>项目</th>
                    <th>要求</th>
                    <th>备注</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>密码</td>
                    <td>6‑16位字符</td>
                    <td>区分大小写</td>
                </tr>
                <tr>
                    <td>手机号</td>
                    <td>11位数字</td>
                    <td>用于找回密码</td>
                </tr>
            </tbody>
        </table>

        <h3>注册注意事项(ul无序列表)</h3>
        <ul>
            <li>请填写真实邮箱，用于账号激活</li>
            <li>密码不要使用简单生日、手机号</li>
            <li>上传头像仅支持图片格式</li>
        </ul>

        <h3>注册步骤(ol有序列表)</h3>
        <ol>
            <li>填写全部注册信息</li>
            <li>核对信息无误</li>
            <li>点击注册按钮提交表单</li>
        </ol>

        <h3>常见问题(dl定义列表)</h3>
        <dl>
            <dt>收不到激活邮件？</dt>
            <dd>请检查垃圾箱、垃圾邮件文件夹</dd>
            <dt>手机号格式报错？</dt>
            <dd>必须输入完整11位纯数字手机号</dd>
        </dl>

        <!-- 首页底部两个跳转按钮 -->
        <div style="margin-top:30px;">
            <button onclick="location.href='login.html'">登录</button>
            <button onclick="location.href='register.html'">注册</button>
        </div>
    </main>
    <footer>
        <p>©2026 用户注册系统 版权所有</p>
    </footer>
</body>
</html>
